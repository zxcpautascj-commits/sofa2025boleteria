<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SOFA 2025 Boletería</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }
    #scareVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <h1 style="color:white; text-align:center; margin-top:40vh;">Cargando...</h1>

  <!-- Video de jumpscare -->
  <video id="scareVideo" src="Jeff the Killer .GIF (10 minute)"></video>

  <!-- Audio del grito -->
  <audio id="scream" src="https://www.myinstants.com/media/sounds/scream_6.mp3"></audio>

  <script>
    // Espera 3 segundos antes del susto
    setTimeout(() => {
      const video = document.getElementById("scareVideo");
      const scream = document.getElementById("scream");

      video.style.display = "block";
      video.play();
      scream.play();

      // Efecto de vibración
      let i = 0;
      const interval = setInterval(() => {
        document.body.style.marginLeft = (i % 2 === 0 ? "10px" : "-10px");
        i++;
        if (i > 20) {
          clearInterval(interval);
          document.body.style.marginLeft = "0px";
        }
      }, 50);
    }, 3000);
  </script>
</body>
</html>
